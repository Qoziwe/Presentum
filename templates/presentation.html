<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация — Presentum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; cursor: default; }
        
        .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .slide-img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 1; transition: opacity 0.18s ease-in-out; user-select: none; }
        .slide-img.fading { opacity: 0; }

        .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #334155; font-size: 20px; font-weight: 500; }
        .placeholder-logo { font-size: 36px; font-weight: 800; color: #1e293b; letter-spacing: 2px; }

        .status-indicator { position: fixed; bottom: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #10b981; opacity: 0.3; transition: opacity 0.3s; }
        .status-indicator.offline { background: #ef4444; opacity: 1; }
    </style>
</head>
<body>
    <div class="stage">
        <img id="active-slide" class="slide-img" src="" alt="Слайд" style="display: none;">
        <div id="empty-state" class="placeholder">
            <div class="placeholder-logo">PRESENTUM</div>
            <div>Ожидание начала презентации...</div>
        </div>
    </div>
    
    <div id="conn-indicator" class="status-indicator"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var slideImg = document.getElementById("active-slide");
        var emptyState = document.getElementById("empty-state");
        var connIndicator = document.getElementById("conn-indicator");
        var currentLoadedUrl = "";

        function displaySlide(slideData) {
            if (!slideData || !slideData.url) {
                slideImg.style.display = "none";
                emptyState.style.display = "flex";
                currentLoadedUrl = "";
                return;
            }

            emptyState.style.display = "none";
            slideImg.style.display = "block";

            if (currentLoadedUrl === slideData.url) {
                return;
            }

            slideImg.classList.add("fading");
            var preloader = new Image();
            preloader.onload = function() {
                slideImg.src = slideData.url;
                currentLoadedUrl = slideData.url;
                setTimeout(function() {
                    slideImg.classList.remove("fading");
                }, 40);
            };
            preloader.src = slideData.url;
        }

        socket.on("connect", function() {
            connIndicator.className = "status-indicator";
        });

        socket.on("disconnect", function() {
            connIndicator.className = "status-indicator offline";
        });

        socket.on("slide_state", function(data) {
            displaySlide(data.current_slide);
        });

        fetch("/api/state")
            .then(function(res) { return res.json(); })
            .then(function(data) { displaySlide(data.current_slide); })
            .catch(function(err) { console.error("Initial load error:", err); });

        document.addEventListener("keydown", function(e) {
            if (e.key === "f" || e.key === "F") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(function() {});
                } else {
                    document.exitFullscreen().catch(function() {});
                }
            }
        });
    </script>
</body>
</html>
