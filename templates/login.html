<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — Presentum</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: #0f1117;
        color: #f0f2f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .login-card {
        background: #1a1d27;
        border: 1px solid #2a2f42;
        border-radius: 16px;
        padding: 36px 32px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 8px;
        text-align: center;
        color: #ffffff;
      }
      p.subtitle {
        font-size: 14px;
        color: #8a93a6;
        text-align: center;
        margin-bottom: 28px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #b0b8c8;
      }
      input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        background: #0f1117;
        border: 1px solid #2e344d;
        border-radius: 10px;
        color: #fff;
        font-size: 16px;
        outline: none;
      }
      input[type="password"]:focus {
        border-color: #6366f1;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4f46e5;
      }
      .alert {
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
        text-align: center;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Presentum</h1>
      <p class="subtitle">Панель управления презентацией</p>
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, msg in messages %}
      <div class="alert">{{ msg }}</div>
      {% endfor %} {% endif %} {% endwith %}
      <form method="POST">
        <div class="form-group">
          <label for="password">Пароль администратора</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autofocus
            placeholder="Введите пароль"
          />
        </div>
        <button type="submit">Войти</button>
      </form>
    </div>
  </body>
</html>
