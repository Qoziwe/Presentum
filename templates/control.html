<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пульт управления — Presentum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #090b10; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2233; background: #101420; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 14px; background: #182032; border: 1px solid #283450; border-radius: 8px; }
        .back-btn:active { background: #222d46; color: #fff; }
        .connection-status { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: #10b981; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
        .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .preview-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; min-height: 0; }
        .slide-counter { font-size: 26px; font-weight: 800; color: #f8fafc; margin-bottom: 12px; letter-spacing: 1px; }
        .slide-counter span { color: #6366f1; }
        .preview-box { width: 100%; max-width: 380px; aspect-ratio: 16/9; background: #000; border: 2px solid #222c44; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .preview-img { width: 100%; height: 100%; object-fit: contain; }
        .empty-preview { color: #64748b; font-size: 14px; text-align: center; }
        .controls-grid { padding: 18px 20px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: #101420; border-top: 1px solid #1c2233; }
        .nav-btn { height: 95px; border: none; border-radius: 20px; font-size: 38px; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; transition: transform 0.08s, background-color 0.1s; }
        .nav-btn:active { transform: scale(0.96); }
        .btn-prev { background: #262e45; border: 1px solid #3b476b; color: #cbd5e1; }
        .btn-prev:active { background: #1d2335; }
        .btn-next { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4); }
        .btn-next:active { background: #4338ca; }
    </style>
</head>
<body>
    <header>
        <a href="/admin" class="back-btn">⬅ В главное меню</a>
        <div class="connection-status">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Онлайн</span>
        </div>
    </header>

    <div class="preview-container">
        <div class="slide-counter">
            Слайд <span id="current-num">{{ state.current_index }}</span> / <span id="total-num">{{ state.total_slides }}</span>
        </div>
        <div class="preview-box">
            {% if state.current_slide %}
                <img id="preview-image" src="{{ state.current_slide.url }}" alt="Текущий слайд" class="preview-img">
                <div id="preview-empty" class="empty-preview" style="display: none;">Слайды не загружены</div>
            {% else %}
                <img id="preview-image" src="" alt="Текущий слайд" class="preview-img" style="display: none;">
                <div id="preview-empty" class="empty-preview">Слайды не загружены</div>
            {% endif %}
        </div>
    </div>

    <div class="controls-grid">
        <button id="btn-prev" class="nav-btn btn-prev" aria-label="Предыдущий слайд">◀</button>
        <button id="btn-next" class="nav-btn btn-next" aria-label="Следующий слайд">▶</button>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script>
        var socket = io({ transports: ["websocket", "polling"] });
        var currentIdx = {{ state.current_index }};
        var totalSlides = {{ state.total_slides }};

        var statusDot = document.getElementById("status-dot");
        var statusText = document.getElementById("status-text");
        var currentNumEl = document.getElementById("current-num");
        var totalNumEl = document.getElementById("total-num");
        var previewImg = document.getElementById("preview-image");
        var previewEmpty = document.getElementById("preview-empty");

        function updateUI(data) {
            currentIdx = data.current_index;
            totalSlides = data.total_slides;
            currentNumEl.textContent = currentIdx;
            totalNumEl.textContent = totalSlides;

            if (data.current_slide && data.current_slide.url) {
                previewImg.src = data.current_slide.url;
                previewImg.style.display = "block";
                previewEmpty.style.display = "none";
            } else {
                previewImg.style.display = "none";
                previewEmpty.style.display = "block";
            }
        }

        socket.on("connect", function() {
            statusDot.className = "status-dot";
            statusText.textContent = "Онлайн";
            statusText.style.color = "#10b981";
        });

        socket.on("disconnect", function() {
            statusDot.className = "status-dot offline";
            statusText.textContent = "Переподключение...";
            statusText.style.color = "#ef4444";
        });

        socket.on("slide_state", function(data) {
            updateUI(data);
        });

        function triggerHaptic() {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(35); } catch(e) {}
            }
        }

        function sendControl(action) {
            triggerHaptic();
            if (socket && socket.connected) {
                socket.emit("admin_" + action);
            } else {
                fetch("/admin/api/control/" + action, {
                    method: "POST",
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                });
            }
        }

        document.getElementById("btn-prev").addEventListener("click", function() {
            sendControl("prev");
        });

        document.getElementById("btn-next").addEventListener("click", function() {
            sendControl("next");
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowLeft" || e.key === "PageUp") {
                sendControl("prev");
            } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
                sendControl("next");
            }
        });
    </script>
</body>
</html>
